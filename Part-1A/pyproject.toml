[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "security-alert-manager"
version = "0.1.0"
description = "Deterministic CLI for managing security alerts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "bandit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

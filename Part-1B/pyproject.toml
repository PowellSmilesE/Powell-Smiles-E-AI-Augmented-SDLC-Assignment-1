[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "security-code-review"
version = "0.1.0"
description = "Local AI-assisted security code review application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema[format]>=4.23,<5",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2",
    "hypothesis>=6.120,<7",
    "pip-audit>=2.7,<3",
    "playwright>=1.50,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "pytest-playwright>=0.7,<1",
    "ruff>=0.9,<1",
    "setuptools==80.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
